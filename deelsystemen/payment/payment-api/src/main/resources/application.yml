server:
  port: 8081

spring:
  application:
    name: payment-api
  jackson:
    deserialization:
      # Het contract zegt additionalProperties: false. Spring Boot zet dit standaard uit;
      # zonder deze regel lift een niet-gedeclareerd veld stilzwijgend mee en is een
      # contractschending onzichtbaar.
      fail-on-unknown-properties: true
  datasource:
    # Vereenvoudiging: H2 in memory. Elke herstart begint leeg, wat voor een demo precies
    # goed is. Er is geen gedeelde database met Order.
    url: jdbc:h2:mem:payment;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  endpoints:
    web:
      exposure:
        # Uitsluitend health en info. Nooit een wildcard.
        include: health,info
  info:
    env:
      enabled: true

# Twee versies met twee betekenissen. build.version komt uit de pom en is die van het
# deelsysteem; contract.serveert is die van de grens en komt uit het register. Ze bewegen
# los van elkaar, en vanaf hoofdstuk 3 serveert één service twee majors naast elkaar —
# vandaar een lijst.
info:
  # Het derde versieniveau: van welke deelsysteemrelease deze container deel uitmaakt.
  # Komt uit de omgeving en niet uit de code — een microservice weet dat zelf niet.
  deelsysteem:
    naam: ${DEELSYSTEEM:onbekend}
    versie: ${DEELSYSTEEM_VERSIE:onbekend}
  contract:
    groep: payment
    artifact: payment-api
    # Komma-gescheiden en geen lijst: een YAML-lijst komt via het info-endpoint naar
    # buiten als {"0": "1.0.0"}, en dat is voor de versieconformiteitscheck lastiger te
    # lezen dan het waard is.
    serveert: 1.0.0
