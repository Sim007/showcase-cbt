# Het deelsysteem Payment. Dit bestand is in CI, Test en Acceptatie hetzelfde: een
# deelsysteem staat één keer beschreven. Een omgeving is een samenstelling van
# deelsysteem-bestanden, geen eigen beschrijving.
#
# Payment heeft binnen de scope van scenario 1 geen buren, dus zijn CI-omgeving is dit
# bestand en verder niets.

services:
  payment-api:
    image: cbt/payment-api:${PAYMENT_API_VERSIE:-1.0.0}
    # De image draait al als een niet-geprivilegieerde gebruiker; expliciet gezet zodat
    # het niet stilzwijgend verandert bij een tagbump.
    user: "100:101"
    security_opt:
      - no-new-privileges:true
    environment:
      # De release waar deze container deel van uitmaakt. Komt uit het
      # releasebestand, niet uit de code: een microservice weet niet in welke
      # deelsysteemversie hij is opgenomen.
      DEELSYSTEEM: ${DEELSYSTEEM}
      DEELSYSTEEM_VERSIE: ${DEELSYSTEEM_VERSIE}
    ports:
      - "${PAYMENT_API_POORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  # De omgeving is het netwerk, niet het compose-project. Elk deelsysteem is een eigen
  # project en wordt los gedeployd; ze vinden elkaar doordat ze in hetzelfde netwerk
  # hangen. Zou de omgeving het project zijn, dan haalt een deploy van Order het net
  # gedeployde Payment weg omdat compose hem als wees ziet.
  default:
    name: ${OMGEVING_NETWERK}
    external: true
