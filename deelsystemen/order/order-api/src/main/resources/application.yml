server:
  port: 8082

spring:
  application:
    name: order-api
  datasource:
    # Vereenvoudiging: H2 in memory, en een eigen database. Er is geen gedeelde opslag
    # met Payment.
    url: jdbc:h2:mem:order;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

payment:
  # De buur. In de CI-omgeving wijst dit naar de stub, op Test naar het echte deelsysteem.
  base-url: ${PAYMENT_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        # Uitsluitend health en info. Nooit een wildcard.
        include: health,info
  info:
    env:
      enabled: true

# Twee versies met twee betekenissen. build.version komt uit de pom en is die van het
# deelsysteem; contract.pin is de contractversie waarop deze consumer zich vastlegt.
info:
  # Het derde versieniveau: van welke deelsysteemrelease deze container deel uitmaakt.
  # Komt uit de omgeving en niet uit de code — een microservice weet dat zelf niet.
  deelsysteem:
    naam: ${DEELSYSTEEM:onbekend}
    versie: ${DEELSYSTEEM_VERSIE:onbekend}
  contract:
    groep: order-payment
    artifact: payment-api
    # De pin van de consumer: hij volgt geen latest. Eén waarde, want een consumer pint op
    # één versie tegelijk.
    pin: 1.0.0
