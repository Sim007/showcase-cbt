# De stub die op de CI-omgeving de buur speelt. Hij staat op de hoofdmap omdat hij van
# geen enkel deelsysteem is: elke consumer gebruikt dezelfde container, alleen met andere
# mappings.
#
# De mappings worden elke run gegenereerd uit de spec uit het register en worden nooit
# gecommit. Read-only gemount: de stub mag ze lezen, niet wijzigen.
#
# Geen vast netwerknaam en geen vaste containernaam, hier noch bij de deelsystemen:
# compose maakt een netwerk per project, en dat is precies wat een omgeving afbakent.
# Stond alles op één netwerk, dan luisterde deze stub naar dezelfde naam als het echte
# deelsysteem en werd het toeval welke van de twee antwoordde.
#
#   docker compose -p ci-order  -f deelsystemen/order/docker-compose.yml -f compose/stub.yml up -d
#   docker compose -p test      -f deelsystemen/order/docker-compose.yml \
#                               -f deelsystemen/payment/docker-compose.yml up -d

services:
  stub:
    image: wiremock/wiremock:3.13.2
    # Draait onder de servicenaam van de buur die hij vervangt, zodat de consumer niets
    # anders hoeft te weten dan op Test.
    hostname: payment-api
    networks:
      default:
        aliases:
          - payment-api
    security_opt:
      - no-new-privileges:true
    command: ["--global-response-templating", "--disable-banner", "--port", "8081"]
    volumes:
      - ${STUB_MAPPINGS:-./build/stub}/mappings:/home/wiremock/mappings:ro
    ports:
      - "${STUB_POORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 20

