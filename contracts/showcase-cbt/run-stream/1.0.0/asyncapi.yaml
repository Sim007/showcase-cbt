asyncapi: 2.6.0
info:
  title: Run Stream
  version: 1.0.0
  description: >
    Wat er tijdens een run gebeurt, als losse feiten. Eén kant op: showcase-CBT vertelt,
    de aanroeper luistert. Starten en afbreken lopen over scenario-api, want een commando
    heeft een antwoord nodig — en daarmee is deze stroom eenrichtingsverkeer en volstaat
    Server-Sent Events.

    Twee regels bepalen de vorm.

    Elke stap heeft een expliciet begin en einde als apart bericht. Er hoeft nooit tekst
    geparsed te worden om te weten waar een stap begint of eindigt; cli-uitvoer is een
    eigen berichtsoort die naar een stapnummer verwijst en verder geen betekenis draagt.

    En showcase-CBT meldt feiten en leidt niets af. Geen deelsysteem-status, geen
    eindoordeel, geen samenvatting. Een stap die door een stop nooit gestart is, levert
    geen bericht — dat hij ontbreekt is het feit.

servers:
  showcase-cbt:
    # Alleen de basis. Het pad staat in de channelnaam hieronder; samen vormen ze het
    # adres. Stond het pad hier ook, dan werd het tweemaal geplakt.
    url: '{host}'
    protocol: sse
    description: >
      Eén endpoint, altijd open. Bij verbinden komt eerst een momentopname, zodat een late
      kijker niet blind begint.
    variables:
      host:
        default: http://localhost:8090

channels:
  /v1/runs/stream:
    subscribe:
      operationId: volgRun
      summary: Alles wat er tijdens een run gebeurt
      message:
        oneOf:
          - $ref: '#/components/messages/Momentopname'
          - $ref: '#/components/messages/RunGestart'
          - $ref: '#/components/messages/StapGestart'
          - $ref: '#/components/messages/StapAfgerond'
          - $ref: '#/components/messages/CliUitvoer'
          - $ref: '#/components/messages/RunAfgerond'

components:

  messages:

    Momentopname:
      name: momentopname
      title: Momentopname bij verbinden
      summary: De stand van zaken op het moment dat je verbindt
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MomentopnamePayload'
      examples:
        - name: lopende-run
          payload:
            soort: momentopname
            tijd: '2026-08-06T09:13:02Z'
            run:
              runId: run-7c41a9
              scenarioId: '01'
              gestartOp: '2026-08-06T09:12:44Z'
            afgerondeStappen:
              - stapNummer: 1
                uitkomst: geslaagd
              - stapNummer: 2
                uitkomst: geslaagd
            lopendeStap: 3
        - name: geen-run
          payload:
            soort: momentopname
            tijd: '2026-08-06T09:13:02Z'
            run: null
            afgerondeStappen: []

    RunGestart:
      name: run-gestart
      title: Run gestart
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RunGestartPayload'
      examples:
        - name: gestart
          payload:
            soort: run-gestart
            tijd: '2026-08-06T09:12:44Z'
            runId: run-7c41a9
            scenarioId: '01'

    StapGestart:
      name: stap-gestart
      title: Stap gestart
      summary: Draagt geen uitkomst — die staat uitsluitend op stap-afgerond.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StapGestartPayload'
      examples:
        - name: gestart
          payload:
            soort: stap-gestart
            tijd: '2026-08-06T09:12:51Z'
            runId: run-7c41a9
            stapNummer: 3

    StapAfgerond:
      name: stap-afgerond
      title: Stap afgerond
      summary: Het enige bericht met een uitkomst.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StapAfgerondPayload'
      examples:
        - name: geslaagd
          payload:
            soort: stap-afgerond
            tijd: '2026-08-06T09:13:07Z'
            runId: run-7c41a9
            stapNummer: 3
            uitkomst: geslaagd
            bijzonderheden: '1632 generated, 1632 passed'
        - name: mislukt
          payload:
            soort: stap-afgerond
            tijd: '2026-08-06T09:13:07Z'
            runId: run-7c41a9
            stapNummer: 3
            uitkomst: mislukt
            bijzonderheden: 'Undocumented HTTP status code - Received: 200, Documented: 201, 400'

    CliUitvoer:
      name: cli-uitvoer
      title: Een regel uitvoer van de opdrachtregel
      summary: >
        Om te tonen, niet om op te redeneren. Wie hieruit een uitkomst afleidt, doet precies
        wat dit contract wil voorkomen.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CliUitvoerPayload'
      examples:
        - name: regel
          payload:
            soort: cli-uitvoer
            tijd: '2026-08-06T09:12:58Z'
            runId: run-7c41a9
            stapNummer: 3
            regel: '  contractverificatie, provider                ok'

    RunAfgerond:
      name: run-afgerond
      title: Run afgerond
      summary: Draagt een reden, geen oordeel.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RunAfgerondPayload'
      examples:
        - name: voltooid
          payload:
            soort: run-afgerond
            tijd: '2026-08-06T09:14:20Z'
            runId: run-7c41a9
            reden: voltooid
        - name: gestopt
          payload:
            soort: run-afgerond
            tijd: '2026-08-06T09:13:09Z'
            runId: run-7c41a9
            reden: gestopt

  schemas:

    Soort:
      type: string
      description: >
        Onderscheidt de berichtsoorten binnen één stroom. Kleine letters met streepjes,
        gelijk aan de naam van het bericht.
      enum:
        - momentopname
        - run-gestart
        - stap-gestart
        - stap-afgerond
        - cli-uitvoer
        - run-afgerond
      example: stap-afgerond

    Tijd:
      type: string
      format: date-time
      description: Wanneer het feit zich voordeed, bij showcase-CBT gemeten.
      example: '2026-08-06T09:13:07Z'

    RunId:
      type: string
      pattern: '^run-[0-9a-f]{6}$'
      example: run-7c41a9

    ScenarioId:
      type: string
      pattern: '^[0-9]{2}$'
      example: '01'

    StapNummer:
      type: integer
      minimum: 1
      description: Verwijst naar het nummer van een stap uit scenario-api.
      example: 3

    Uitkomst:
      type: string
      description: >
        Alleen deze twee. Nadrukkelijk geen kleur: groen en rood zijn presentatie, en
        presentatie is een afleiding — de aanroeper bepaalt zelf welke kleur bij geslaagd
        of mislukt hoort. Zou showcase-CBT hier "groen" sturen, dan besliste hij mee over
        het beeld, en dat is de kant die volgens context.md niet afleidt.

        Een stap die nooit gestart is heeft geen uitkomst en levert geen bericht; dat hij
        ontbreekt is wat "niet uitgevoerd" betekent.
      enum: [geslaagd, mislukt]
      example: geslaagd

    Run:
      type: object
      required: [runId, scenarioId, gestartOp]
      additionalProperties: false
      properties:
        runId:
          $ref: '#/components/schemas/RunId'
        scenarioId:
          $ref: '#/components/schemas/ScenarioId'
        gestartOp:
          $ref: '#/components/schemas/Tijd'

    AfgerondeStap:
      type: object
      required: [stapNummer, uitkomst]
      additionalProperties: false
      properties:
        stapNummer:
          $ref: '#/components/schemas/StapNummer'
        uitkomst:
          $ref: '#/components/schemas/Uitkomst'
        bijzonderheden:
          type: string
          example: '1632 generated, 1632 passed'

    MomentopnamePayload:
      type: object
      description: >
        Bevat bewust geen cli-uitvoer. Die draagt geen betekenis, en een late kijker zou
        anders op een grote inhaalslag wachten voordat hij iets ziet.
      required: [soort, tijd, run, afgerondeStappen]
      additionalProperties: false
      properties:
        soort:
          $ref: '#/components/schemas/Soort'
        tijd:
          $ref: '#/components/schemas/Tijd'
        run:
          description: Null wanneer er geen run loopt. Zwijgen zou dubbelzinnig zijn.
          oneOf:
            - $ref: '#/components/schemas/Run'
            - type: 'null'
        afgerondeStappen:
          type: array
          description: In de volgorde waarin ze zijn afgerond.
          items:
            $ref: '#/components/schemas/AfgerondeStap'
        lopendeStap:
          $ref: '#/components/schemas/StapNummer'

    RunGestartPayload:
      type: object
      required: [soort, tijd, runId, scenarioId]
      additionalProperties: false
      properties:
        soort:
          $ref: '#/components/schemas/Soort'
        tijd:
          $ref: '#/components/schemas/Tijd'
        runId:
          $ref: '#/components/schemas/RunId'
        scenarioId:
          $ref: '#/components/schemas/ScenarioId'

    StapGestartPayload:
      type: object
      required: [soort, tijd, runId, stapNummer]
      additionalProperties: false
      properties:
        soort:
          $ref: '#/components/schemas/Soort'
        tijd:
          $ref: '#/components/schemas/Tijd'
        runId:
          $ref: '#/components/schemas/RunId'
        stapNummer:
          $ref: '#/components/schemas/StapNummer'

    StapAfgerondPayload:
      type: object
      required: [soort, tijd, runId, stapNummer, uitkomst]
      additionalProperties: false
      properties:
        soort:
          $ref: '#/components/schemas/Soort'
        tijd:
          $ref: '#/components/schemas/Tijd'
        runId:
          $ref: '#/components/schemas/RunId'
        stapNummer:
          $ref: '#/components/schemas/StapNummer'
        uitkomst:
          $ref: '#/components/schemas/Uitkomst'
        bijzonderheden:
          type: string
          description: Wat er te melden was, zoals het aantal gedraaide gevallen.
          example: '1632 generated, 1632 passed'

    CliUitvoerPayload:
      type: object
      required: [soort, tijd, runId, stapNummer, regel]
      additionalProperties: false
      properties:
        soort:
          $ref: '#/components/schemas/Soort'
        tijd:
          $ref: '#/components/schemas/Tijd'
        runId:
          $ref: '#/components/schemas/RunId'
        stapNummer:
          $ref: '#/components/schemas/StapNummer'
        regel:
          type: string
          description: Eén regel, zonder regeleinde.
          example: '  contractverificatie, provider                ok'

    RunAfgerondPayload:
      type: object
      required: [soort, tijd, runId, reden]
      additionalProperties: false
      properties:
        soort:
          $ref: '#/components/schemas/Soort'
        tijd:
          $ref: '#/components/schemas/Tijd'
        runId:
          $ref: '#/components/schemas/RunId'
        reden:
          type: string
          description: >
            Waarom de run ophield, niet hoe hij afliep. Voltooid betekent dat alle stappen
            aan bod zijn geweest; gestopt dat een stap mislukte en de pipeline daar
            ophield; afgebroken dat er om afbreken is gevraagd. Wat dat betekent voor een
            deelsysteem of voor het rapport, leidt de aanroeper zelf af.
          enum: [voltooid, gestopt, afgebroken]
          example: voltooid
